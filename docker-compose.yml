services:
  dhlottery:
    build: .
    image: dhlottery:latest
    container_name: dhlottery
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    volumes:
      # 호스트 경로 고정 (Jenkins 컨테이너 workspace 상대경로 사용 금지)
      # docker.sock 로 compose 실행 시 마운트는 Docker 호스트 기준으로 해석됨
      - /opt/dhlottery/config.json:/app/config.json:ro
      - /opt/dhlottery/logs:/app/logs
    command: ["-service"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
